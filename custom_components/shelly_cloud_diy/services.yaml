download_and_convert_history:
  name: Download and Convert History
  description: >-
    Downloads Shelly EM historical energy data from local gateway proxy,
    converts it to CSV format compatible with homeassistant-statistics
    HACS integration, and saves to config directory for import.
  fields:
    gateway_url:
      name: Gateway URL
      description: >-
        Base URL of local gateway that proxies to Shelly devices
        (e.g., https://myproxy.com/sensor). If not provided, uses the URL
        configured in integration options.
      required: false
      example: "https://silver.oldtownsultanahmet.com/sensor"
      selector:
        text:
    device_id:
      name: Device ID
      description: >-
        Optional Shelly Cloud device ID to convert. If not provided,
        converts data for all EM devices.
      required: false
      example: "80157669366571"
      selector:
        text:

replace_device:
  name: Replace device
  description: >-
    Transplant a dead Shelly's Home Assistant identity (entity IDs, the HA
    device, name, area, history and every automation / dashboard reference)
    onto a new Shelly of the same model, so you don't have to re-configure
    Home Assistant after a hardware swap. Add and enable the new device first,
    then run this. Tip: tick "Dry run" first to preview the changes.
  fields:
    old_device:
      name: Old (replaced) device
      description: The Shelly device that broke / was removed.
      required: true
      selector:
        device:
          integration: shelly_cloud_diy
    new_device:
      name: New device
      description: The new Shelly that should take over. Enable it first.
      required: true
      selector:
        device:
          integration: shelly_cloud_diy
    dry_run:
      name: Dry run
      description: Only log and show what would change, without applying it.
      required: false
      default: false
      selector:
        boolean:
    force:
      name: Force (ignore model mismatch)
      description: >-
        Proceed even if the two devices report different models. Only use this
        if you are sure the channel layout matches.
      required: false
      default: false
      selector:
        boolean:

fleet_map:
  name: Fleet map
  description: >-
    Read-only overlay: matches every cloud device to its local (native
    Shelly) twin by MAC, suggests names, and flags any device whose control
    runs over the cloud. Writes a report to your notifications. Safe to run
    anytime — it changes nothing unless you explicitly opt in below.
  fields:
    dry_run:
      name: Dry run
      description: >-
        Only show the report, without applying any native name suggestions.
        On by default.
      required: false
      default: true
      selector:
        boolean:
    apply_native_name_suggestions:
      name: Apply native name suggestions
      description: >-
        Also copy each cloud alias onto its matched local (native Shelly)
        device. Only writes the technical name, never a name you set
        yourself. Requires turning Dry run off. Off by default.
      required: false
      default: false
      selector:
        boolean:

# Scope note (for maintainers/reviewers — deliberately NOT in the user-facing
# description below): this is an account-vs-registry reconciliation Home
# Assistant has no built-in for. It inspects and touches strictly this
# integration's own devices (those keyed by its cloud device id), decides
# absence only from the account's alias-independent inventory (never from a name
# map, which would risk deleting a never-renamed device), refuses to act when
# that inventory looks incomplete, and never removes anything unless the user
# explicitly opts in after the previewed, non-auto-reversible report.
detect_orphans:
  name: Find Shelly devices no longer in your account
  description: >-
    Reconciles the Shelly devices this integration created against your live
    Shelly account inventory and reports any whose hardware is no longer in the
    account (sold, factory-reset, or deleted in the Shelly app). Inform-only by
    default: it writes a report to your notifications and changes nothing.
    Removal is strictly opt-in — turn Dry run off and Remove on to detach the
    listed devices; it is previewed first and is not automatically reversible.
  fields:
    dry_run:
      name: Dry run
      description: >-
        Only show the report, without removing anything. On by default.
      required: false
      default: true
      selector:
        boolean:
    remove:
      name: Remove listed devices
      description: >-
        Detach the devices found to be no longer in your account, together with
        their entities. Requires turning Dry run off. This does not come back
        automatically — re-add the hardware in the integration options if it
        returns. Off by default.
      required: false
      default: false
      selector:
        boolean:
    devices:
      name: Limit to these devices
      description: >-
        Optional. Restrict removal to the devices you pick here — only those
        that are also independently found to be no longer in your account are
        removed. Leave empty to consider every eligible device.
      required: false
      selector:
        device:
          integration: shelly_cloud_diy
          multiple: true
