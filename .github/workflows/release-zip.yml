name: Attach release ZIP

# Attaches a HACS-installable shelly_cloud_diy.zip to every published GitHub
# release. HACS downloads this asset (see "filename" in hacs.json), which makes
# GitHub increment the asset's download counter — a cumulative, non-expiring
# install signal, unlike the 14-day Traffic → Clones window.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the ZIP to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and upload ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shelly_cloud_diy.zip
        run: |
          cd custom_components/shelly_cloud_diy
          zip -r "$GITHUB_WORKSPACE/shelly_cloud_diy.zip" . \
            -x '*__pycache__*' -x '*.pyc' -x '*.ruff_cache*'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" shelly_cloud_diy.zip --clobber
